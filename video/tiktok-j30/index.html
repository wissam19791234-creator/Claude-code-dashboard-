<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Scalify J-30</title>
<style>
@font-face{font-family:Anton;src:url(Anton-400.woff2)}
@font-face{font-family:IT;font-weight:600;src:url(InterTight-600.woff2)}
@font-face{font-family:IT;font-weight:700;src:url(InterTight-700.woff2)}
@font-face{font-family:IT;font-weight:800;src:url(InterTight-800.woff2)}
:root{--sun:#ffd731;--mint:#55db9c;--violet:#5c4ade;--ember:#fb4903;--sky:#dceeff;--lav:#e9ccff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:IT,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;transform-origin:50% 50%}
.layer{position:absolute;inset:0}
#bg{background:radial-gradient(120% 80% at 50% 38%,#3b2ca8 0%,#17123f 45%,#07061a 100%)}
#bg2{opacity:0;background:radial-gradient(120% 80% at 50% 40%,#1c1c1c 0%,#050505 70%)}
.shot{position:absolute;inset:-6%;opacity:0;will-change:transform,filter}
.shot img{width:100%;height:100%;object-fit:cover}
#grade{mix-blend-mode:soft-light;background:linear-gradient(160deg,#ff9a3c 0%,#ff6a3c00 45%,#1f7a8c00 55%,#14537a 100%);opacity:0}
#shade{background:linear-gradient(180deg,#0008 0%,#0000 25%,#0000 55%,#000c 100%);opacity:0}
#night{background:#0b1a5a;mix-blend-mode:multiply;opacity:0}
#gl{pointer-events:none}
#glitch{opacity:0}
#glitch div{position:absolute;inset:0;background-size:cover;background-position:center}
canvas#three{position:absolute;inset:0;width:1080px;height:1920px}
/* UI 2D */
.ui{position:absolute;opacity:0;will-change:transform,opacity}
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;padding:16px 34px;font-weight:800;font-size:42px;white-space:nowrap}
.glass{background:#ffffff26;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:2px solid #ffffff55}
.emo{font-family:"Noto Color Emoji";font-weight:400}
.disp{font-family:Anton;text-transform:uppercase;line-height:.95}
#brand{left:0;right:0;top:1060px;text-align:center;font-size:190px;letter-spacing:.02em}
#svcTag{left:0;right:0;top:250px;text-align:center}
#svcTag .pill{background:#000;border:3px solid #fff;font-size:46px}
#svcTag .pill b{color:var(--mint)}
.bub{max-width:760px;padding:26px 34px;border-radius:40px;font-size:44px;font-weight:700;line-height:1.25;box-shadow:0 20px 50px #0006}
#b1{left:70px;top:330px;background:#fff;color:#000;border-bottom-left-radius:10px}
#b2{right:70px;top:560px;background:var(--violet);color:#fff;border-bottom-right-radius:10px}
#b2 small{display:block;margin-bottom:6px;font-size:30px;color:var(--sun)}
#clock{left:0;right:0;top:170px;text-align:center}
#clock .pill{font-size:44px;color:#fff}
#perMonth{left:0;right:0;top:1000px;text-align:center;font-size:110px;color:#fff}
#stamp{left:50%;top:1140px;margin-left:-380px;width:760px;text-align:center;padding:24px 0;border-radius:999px;background:#fff;color:#000;font-family:Anton;font-size:76px;text-transform:uppercase;box-shadow:0 0 0 6px #000,12px 12px 0 6px var(--ember)}
#founders{left:0;right:0;top:250px;text-align:center}
#founders .pill{background:var(--sun);color:#000;font-size:46px}
#annual{left:0;right:0;top:1010px;text-align:center;font-size:110px}
#seats{left:90px;right:90px;top:1150px;display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
#seats i{width:64px;height:64px;border-radius:50%;background:var(--violet);border:4px solid #fff;opacity:0}
#endTag{left:0;right:0;top:1010px;text-align:center;font-size:58px;font-weight:800}
#follow{left:0;right:0;top:1150px;text-align:center}
#follow .pill{background:var(--ember);color:#fff;font-size:64px;padding:24px 56px;box-shadow:0 18px 50px #fb490388}
#leak{mix-blend-mode:screen;opacity:0;background:radial-gradient(60% 45% at 20% 25%,#ff7a2f 0%,#ff3d6e88 35%,#0000 70%),radial-gradient(50% 40% at 85% 80%,#ffd731aa 0%,#0000 70%)}
#flash{background:#fff;opacity:0}
#vig{background:radial-gradient(120% 75% at 50% 45%,#0000 55%,#000a 100%)}
#grain{mix-blend-mode:overlay;opacity:.16;width:1080px;height:1920px;image-rendering:pixelated}
/* sous-titres */
#caps{position:absolute;left:50px;right:50px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 40px}
.w{display:inline-block;font-family:Anton;text-transform:uppercase;line-height:1.06;color:#fff;-webkit-text-stroke:16px #000;paint-order:stroke fill;text-shadow:0 10px 0 #000,0 0 40px #0008}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="stage">
  <div class="layer" id="bg"></div>
  <div class="layer" id="bg2"></div>
  <div class="layer" id="shots"></div>
  <div class="layer" id="glitch"><div></div><div></div><div></div></div>
  <div class="layer" id="night"></div>
  <div class="layer" id="grade"></div>
  <div class="layer" id="shade"></div>
  <canvas id="three" width="1080" height="1920"></canvas>
  <div class="layer" id="gl">
    <div class="ui disp" id="brand">Scalify</div>
    <div class="ui" id="svcTag"><span class="pill"><b>✓</b><span id="svcName">Site internet</span></span></div>
    <div class="ui" id="clock"><span class="pill glass"><span class="emo" id="clockIc">☀️</span><span id="clockT">14:02</span></span></div>
    <div class="ui bub" id="b1">Vous êtes ouverts dimanche ?</div>
    <div class="ui bub" id="b2"><small>Assistant IA · 3 s</small>Oui, de 9 h à 13 h ! Je vous réserve une table ? <span class="emo">😊</span></div>
    <div class="ui disp" id="perMonth">par mois</div>
    <div class="ui" id="stamp">Sans rendez-vous</div>
    <div class="ui" id="founders"><span class="pill"><span class="emo">🔥</span>Offre fondateurs</span></div>
    <div class="ui disp" id="annual">sur l’annuel</div>
    <div class="ui" id="seats"></div>
    <div class="ui" id="endTag">Lancement dans 30 jours</div>
    <div class="ui" id="follow"><span class="pill"><span class="emo">🔔</span>Abonnez-vous</span></div>
  </div>
  <div class="layer" id="leak"></div>
  <div class="layer" id="vig"></div>
  <canvas class="layer" id="grain" width="360" height="640"></canvas>
  <div class="layer" id="flash"></div>
  <div id="caps"></div>
</div>
<script type="module" src="main.js"></script>
</body></html>
