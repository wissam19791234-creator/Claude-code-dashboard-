<!-- ═════════ SCX : couche d'effets (kinetic, mesh, ticker, split-flap, holo, comic, blueprint, liquid, particules, ASCII) ═════════ -->
<style id="scx">
/* jetons de la couche d'effets, alignés sur le système existant */
:root{--scx-ink:#000;--scx-bp:#1d4ed8;--scx-bp-line:#ffffff2e;--scx-glow:#ffd731;--scx-holo:linear-gradient(115deg,#ff8ad8 0%,#ffd731 22%,#55db9c 44%,#4da2ff 66%,#b18cff 88%,#ff8ad8 100%)}
/* progression de lecture */
.scx-prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:120;height:4px;pointer-events:none;background:transparent}
.scx-prog i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--violet),var(--ember),var(--sun))}
/* nav en verre au défilement (glassmorphism) */
.nav.is-scrolled{background:#ffffffc7!important;-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
/* hero : gradient mesh */
.hero{position:relative;isolation:isolate}
.scx-mesh{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.scx-mesh i{position:absolute;width:46vmax;aspect-ratio:1;border-radius:50%;filter:blur(60px);opacity:.55;mix-blend-mode:multiply}
.scx-mesh i:nth-child(1){left:-12%;top:-18%;background:var(--lavender);animation:scxDrift1 22s ease-in-out infinite alternate}
.scx-mesh i:nth-child(2){right:-14%;top:4%;background:var(--mint);animation:scxDrift2 26s ease-in-out infinite alternate}
.scx-mesh i:nth-child(3){left:30%;top:38%;width:34vmax;background:var(--sun);opacity:.35;animation:scxDrift3 30s ease-in-out infinite alternate}
@keyframes scxDrift1{to{transform:translate(18vw,10vh) scale(1.15)}}
@keyframes scxDrift2{to{transform:translate(-16vw,14vh) scale(.9)}}
@keyframes scxDrift3{to{transform:translate(-10vw,-12vh) scale(1.2)}}
/* hero : kinetic type */
.hero-title .scx-ch{display:inline-block;transform-origin:50% 90%;animation:scxRise .9s cubic-bezier(.2,1.4,.3,1) both;animation-delay:calc(var(--i)*38ms + 120ms);will-change:transform}
.hero-title .scx-sp{display:inline-block;width:.28em}
@keyframes scxRise{from{transform:translateY(.55em) rotate(10deg) scale(.9)}}
@media (hover:hover){.hero-title:hover .scx-ch{animation:scxWave .7s ease-in-out both;animation-delay:calc(var(--i)*30ms)}}
@keyframes scxWave{40%{transform:translateY(-.12em) rotate(-4deg)}}
/* titres de section : surlignage qui balaie (repos = surligné) */
.sec-title .dl--a{background:linear-gradient(transparent 62%,var(--sun) 62% 92%,transparent 92%) no-repeat 0 0/100% 100%;transition:background-size .9s var(--ease)}
.band--sky .sec-title .dl--a,.band--concrete .sec-title .dl--a{background-image:linear-gradient(transparent 62%,#fff 62% 92%,transparent 92%)}
.sec-title .dl--a.scx-pre{background-size:0% 100%}
/* bandeau néo-brutaliste */
.scx-tick{overflow:hidden;border-block:var(--bd);background:#000;color:var(--sun);transform:rotate(-1.6deg);margin-block:18px;padding-block:14px;width:104%;margin-left:-2%}
.scx-tick-in{display:flex;width:max-content;animation:scxMarq 32s linear infinite}
.scx-tick span{font:400 clamp(26px,4vw,44px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;padding-inline:.5em}
.scx-tick b{color:#fff;font-weight:400}
.scx-tick em{font-style:normal;color:var(--mint)}
@keyframes scxMarq{to{transform:translateX(-50%)}}
/* split-flap : compte à rebours */
.scx-cd{display:grid;gap:10px;justify-items:start}
.scx-cd-k{font:800 12.5px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:#e2dcff}
.scx-cd-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.scx-grp{display:grid;justify-items:center;gap:6px}
.scx-grp small{font:800 11px/1 var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:#e2dcff}
.scx-digits{display:flex;gap:4px}
.scx-flap{position:relative;display:grid;place-items:center;width:clamp(38px,6vw,54px);height:clamp(54px,8.4vw,76px);border:var(--bd);border-radius:10px;background:#16123a;color:var(--scx-glow);font:400 clamp(34px,5.4vw,50px)/1 var(--f-display);text-shadow:0 0 6px #ffd731cc,0 0 18px #ffd73166;perspective:300px;overflow:hidden;box-shadow:0 4px 0 #000;font-variant-numeric:tabular-nums}
.scx-flap:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#000;opacity:.7}
.scx-flap.is-flip{animation:scxFlip .42s cubic-bezier(.3,.7,.3,1)}
@keyframes scxFlip{0%{transform:rotateX(0)}45%{transform:rotateX(-88deg);filter:brightness(.6)}100%{transform:rotateX(0)}}
.scx-colon{font:400 clamp(30px,4.6vw,44px)/1 var(--f-display);color:var(--scx-glow);text-shadow:0 0 10px #ffd73199;padding-bottom:22px}
.scx-cd-date{font-size:13.5px;font-weight:700;color:#fff}
/* holographique : carte recommandée + avantages fondateurs */
.plan--rec,.fnd-perks li{position:relative;overflow:hidden;isolation:isolate}
.plan--rec:after,.fnd-perks li:after{content:"";position:absolute;inset:-40%;z-index:1;pointer-events:none;background:var(--scx-holo);background-size:200% 200%;mix-blend-mode:color-dodge;opacity:.16;transform:translate(calc(var(--hx,0)*14%),calc(var(--hy,0)*14%)) rotate(calc(var(--hx,0)*12deg));transition:opacity .3s;animation:scxHolo 9s linear infinite}
.plan--rec:hover:after,.fnd-perks li:hover:after{opacity:.42}
@keyframes scxHolo{to{background-position:200% 0}}
/* comic + trame (avis testeurs) */
#avis .sec-head{position:relative}
.scx-pow{position:absolute;right:max(2%,calc(50% - 360px));top:-6px;display:grid;place-items:center;width:118px;aspect-ratio:1;font:400 26px/1 var(--f-display);color:#000;text-transform:uppercase;rotate:12deg;background:var(--sun);clip-path:polygon(50% 0,61% 23%,86% 10%,78% 37%,100% 50%,78% 63%,86% 90%,61% 77%,50% 100%,39% 77%,14% 90%,22% 63%,0 50%,22% 37%,14% 10%,39% 23%);filter:drop-shadow(3px 3px 0 #000);animation:scxPow 3.2s ease-in-out infinite}
@keyframes scxPow{50%{scale:1.08;rotate:6deg}}
.tst-card{position:relative;overflow:hidden}
.tst-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#0003 1.2px,transparent 1.6px) 0 0/8px 8px;opacity:0;transition:opacity .25s}
.tst-card:hover:after{opacity:1}
@media (max-width:700px){.scx-pow{width:84px;font-size:19px;top:-18px;right:2%}}
/* blueprint : installation */
#installation{position:relative;background-color:var(--scx-bp);background-image:linear-gradient(var(--scx-bp-line) 1px,transparent 1px),linear-gradient(90deg,var(--scx-bp-line) 1px,transparent 1px),linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);background-size:96px 96px,96px 96px,24px 24px,24px 24px;color:#fff}
#installation .sec-title,#installation .sec-sub{color:#fff}
#installation .eyebrow{background:#fff;color:#000}
#installation .inst-steps{counter-reset:none;position:relative}
#installation .inst-steps li{position:relative;border:2px dashed #ffffffcc;background:#ffffff12;color:#fff;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#installation .inst-steps li h3,#installation .inst-steps li p{color:#fff}
#installation .inst-steps b{background:#fff;color:var(--scx-bp)}
#installation .inst-steps li:before{content:attr(data-scx-ref);position:absolute;top:10px;right:12px;font:600 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#ffffffb0}
#installation .inst-box{border:2px solid #fff;background:#fff;color:#000}
.scx-tb{display:flex;flex-wrap:wrap;gap:0;margin:14px 0 0;border:2px solid #fff;width:max-content;max-width:100%;font:600 11.5px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase}
.scx-tb span{padding:8px 12px;border-right:2px solid #fff}
.scx-tb span:last-child{border-right:0}
/* liquid morph : CTA final */
.final{position:relative;isolation:isolate}
.scx-blob{position:absolute;left:50%;top:50%;z-index:-1;width:min(70vw,620px);aspect-ratio:1;translate:-50% -55%;background:radial-gradient(circle at 30% 30%,#fff 0,var(--sun) 35%,var(--lavender) 75%);border-radius:42% 58% 63% 37%/45% 41% 59% 55%;opacity:.75;animation:scxLiquid 14s ease-in-out infinite,scxSpin 40s linear infinite;pointer-events:none}
@keyframes scxLiquid{25%{border-radius:63% 37% 44% 56%/56% 61% 39% 44%}50%{border-radius:37% 63% 52% 48%/38% 55% 45% 62%}75%{border-radius:55% 45% 33% 67%/61% 37% 63% 39%}}
@keyframes scxSpin{to{rotate:1turn}}
/* boutons « clay 3D » + magnétiques */
.btn--lg{box-shadow:0 4px 0 #000;transition:background-color var(--t),color var(--t),transform .12s var(--ease),box-shadow .12s var(--ease)}
.btn--lg.btn--primary{box-shadow:0 4px 0 var(--violet)}
.btn--lg:active{transform:translateY(3px)!important;box-shadow:0 1px 0 #000}
.btn--lg.btn--primary:active{box-shadow:0 1px 0 var(--violet)}
/* particules */
.scx-fx{position:fixed;inset:0;z-index:130;pointer-events:none;width:100%;height:100%}
/* ASCII (pied de page) */
.scx-ascii{margin:18px 0 0;font:700 clamp(8px,1.15vw,12px)/1.05 ui-monospace,Menlo,Consolas,monospace;color:var(--sun);white-space:pre;overflow:hidden;max-width:100%;user-select:none}
.foot-brand{min-width:0}
@media (prefers-reduced-motion:reduce){.scx-mesh i,.hero-title .scx-ch,.scx-tick-in,.scx-flap,.plan--rec:after,.fnd-perks li:after,.scx-pow,.scx-blob{animation:none!important}.scx-fx{display:none}}
</style>
<div class="scx-prog" aria-hidden="true"><i></i></div>
<canvas class="scx-fx" aria-hidden="true"></canvas>
<script id="scx-js">
(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  // ---- progression de lecture
  const bar = document.querySelector('.scx-prog');
  const onScroll = () => { const h = document.documentElement; const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight); bar.style.setProperty('--p', p.toFixed(4)); };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  // ---- kinetic type du hero (lettres découpées, lecteur d'écran conservé via aria-label)
  const h1 = document.querySelector('.hero-title');
  if (h1 && !h1.dataset.scx) {
    h1.dataset.scx = 1; h1.setAttribute('aria-label', h1.textContent.trim()); let i = 0;
    $$('.dl', h1).forEach(dl => { const txt = dl.textContent; dl.textContent = ''; dl.setAttribute('aria-hidden', 'true');
      for (const ch of txt) { const s = document.createElement('span'); if (ch === ' ') s.className = 'scx-sp'; else { s.className = 'scx-ch'; s.textContent = ch; s.style.setProperty('--i', i++); } dl.appendChild(s); } });
  }
  // ---- surlignage des titres quand ils entrent à l'écran
  if (!RM && 'IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.remove('scx-pre'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -12% 0px' });
    $$('.sec-title .dl--a').forEach(el => { if (el.getBoundingClientRect().top > innerHeight) { el.classList.add('scx-pre'); io.observe(el); } });
  }
  // ---- compte à rebours split-flap jusqu'au lancement (2 novembre 2026, 00:00 heure de Paris)
  const cd = document.querySelector('[data-scx-cd]');
  if (cd) {
    const T = Date.parse('2026-11-02T00:00:00+01:00');
    const cells = {}; $$('[data-u]', cd).forEach(g => (cells[g.dataset.u] = $$('.scx-flap', g)));
    const set = (u, v) => { const s = String(v).padStart(cells[u].length, '0'); cells[u].forEach((f, i) => { if (f.textContent !== s[i]) { f.textContent = s[i]; if (!RM) { f.classList.remove('is-flip'); void f.offsetWidth; f.classList.add('is-flip'); } } }); };
    const tick = () => { let d = Math.max(0, T - Date.now()); const D = Math.floor(d / 864e5); d -= D * 864e5; const Hh = Math.floor(d / 36e5); d -= Hh * 36e5; const M = Math.floor(d / 6e4); d -= M * 6e4;
      set('d', D); set('h', Hh); set('m', M); set('s', Math.floor(d / 1e3)); };
    tick(); setInterval(tick, 1000);
  }
  // ---- reflet holographique qui suit le pointeur
  const holo = el => el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); el.style.setProperty('--hx', ((e.clientX - r.left) / r.width - .5).toFixed(3)); el.style.setProperty('--hy', ((e.clientY - r.top) / r.height - .5).toFixed(3)); });
  $$('.fnd-perks li').forEach(holo);
  new MutationObserver(() => $$('.plan--rec:not([data-scx])').forEach(el => { el.dataset.scx = 1; holo(el); })).observe(document.body, { childList: true, subtree: true });
  $$('.plan--rec').forEach(el => { el.dataset.scx = 1; holo(el); });
  // ---- références « plan » sur les étapes d'installation
  $$('#installation .inst-steps li').forEach((li, i) => li.setAttribute('data-scx-ref', `SCX-07 / ${String(i + 1).padStart(2, '0')}`));
  // ---- boutons magnétiques (souris uniquement)
  if (!RM && matchMedia('(hover:hover) and (pointer:fine)').matches) $$('.btn--lg').forEach(b => {
    b.addEventListener('pointermove', e => { const r = b.getBoundingClientRect(); b.style.transform = `translate(${((e.clientX - r.left) / r.width - .5) * 8}px,${((e.clientY - r.top) / r.height - .5) * 6}px)`; });
    b.addEventListener('pointerleave', () => (b.style.transform = ''));
  });
  // ---- particules (confettis aux couleurs Scalify) au clic des boutons principaux
  const cv = document.querySelector('.scx-fx'), cx = cv.getContext('2d'); let P = [], raf = 0;
  const fit = () => { const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); };
  fit(); addEventListener('resize', fit);
  const COL = ['#ffd731', '#55db9c', '#5c4ade', '#fb4903', '#4da2ff', '#e9ccff'];
  const burst = (x, y, n = 34) => { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 6; P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, r: 3 + Math.random() * 5, c: COL[i % COL.length], s: Math.random() < .4 ? 1 : 0, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 1 }); } if (!raf) raf = requestAnimationFrame(step); };
  const step = () => { cx.clearRect(0, 0, innerWidth, innerHeight);
    P = P.filter(p => p.life > 0); for (const p of P) { p.vy += .22; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .016;
      cx.save(); cx.globalAlpha = Math.max(0, p.life); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.strokeStyle = '#000'; cx.lineWidth = 1;
      if (p.s) { cx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); cx.strokeRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); } else { cx.beginPath(); cx.arc(0, 0, p.r, 0, 7); cx.fill(); cx.stroke(); } cx.restore(); }
    raf = P.length ? requestAnimationFrame(step) : 0; };
  if (!RM) document.addEventListener('click', e => { const b = e.target.closest('.btn--primary'); if (!b) return; const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); }, true);
  // ---- ASCII animé dans le pied de page
  const pre = document.querySelector('[data-scx-ascii]');
  if (pre) {
    const CH = ' .:-=+*#%@', Wd = 46, Hd = 7; let t = 0;
    const draw = () => { let out = ''; for (let y = 0; y < Hd; y++) { for (let x = 0; x < Wd; x++) {
        const v = Math.sin(x * .22 + t) + Math.sin(y * .7 - t * 1.3) + Math.sin((x + y) * .15 + t * .7) + Math.sin(Math.hypot(x - Wd / 2, (y - Hd / 2) * 3) * .35 - t * 1.6);
        out += CH[Math.max(0, Math.min(CH.length - 1, Math.floor((v + 4) / 8 * CH.length)))]; } out += '\n'; }
      const label = ' S C A L I F Y '; const row = 3, start = Math.floor((Wd - label.length) / 2); const lines = out.split('\n'); lines[row] = lines[row].slice(0, start) + label + lines[row].slice(start + label.length);
      pre.textContent = lines.join('\n'); };
    draw(); if (!RM) setInterval(() => { t += .18; draw(); }, 90);
  }
})();
</script>
