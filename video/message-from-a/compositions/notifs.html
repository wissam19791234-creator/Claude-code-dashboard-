<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /><title>notifs</title></head>
<body>
<template id="notifs">
<style>
@font-face { font-family: "Inter Tight"; src: url("assets/fonts/InterTight-var.woff2") format("woff2"); font-weight: 100 900; }
#n-list { position: absolute; inset: 0; }
.nt { position: absolute; left: 90px; top: 0; width: 900px; border-radius: 46px; padding: 26px 40px 28px 132px;
  background: rgba(255,255,255,0.88); -webkit-backdrop-filter: blur(28px) saturate(1.5); backdrop-filter: blur(28px) saturate(1.5);
  box-shadow: 0 14px 44px rgba(40,8,40,0.22); transform-origin: 50% 0%; font-family: "Inter Tight", sans-serif; color: #111114; }
.nt .ic { position: absolute; left: 30px; top: 30px; width: 80px; height: 80px; }
.nt .hd { height: 44px; display: flex; justify-content: space-between; align-items: center; }
.nt .hd b { font-weight: 700; font-size: 34px; letter-spacing: -0.01em; }
.nt .hd i { font-style: normal; font-weight: 500; font-size: 28px; color: #4f4f56; }
.nt .bd { margin-top: 6px; font-weight: 500; font-size: 40px; line-height: 50px; letter-spacing: -0.01em; white-space: nowrap; }
.nt .bd b { font-weight: 800; }
.nt.s .bd strong { font-weight: 700; color: #e03f00; }
</style>
<div id="root" data-composition-id="notifs" data-width="1080" data-height="1920">
  <div id="n-list"></div>
</div>
<script>
(function () {
  var ICON_A = '<svg class="ic" viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="#141018"/>' +
    '<text x="40" y="55" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="44" fill="#ffffff">A</text></svg>';
  var ICON_S = '<svg class="ic" viewBox="0 0 80 80"><defs><linearGradient id="n-sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#fb4903"/></linearGradient></defs>' +
    '<rect width="80" height="80" rx="19" fill="url(#n-sg)"/>' +
    '<path d="M 63 -66 H -30 a 37.5 37.5 0 0 0 0 75 h 56.6 a 37.5 37.5 0 0 1 0 75 H -66" transform="translate(40,29) scale(0.27)" fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="63" cy="62" r="6" fill="#ffffff"/></svg>';
  var Y0 = 560, GAP = 16, YMAX = 1310, H = function (m) { return 104 + 50 * m.l.length; };
  var list = document.getElementById('n-list'), html = '';
  MSG.forEach(function (m, k) {
    var body = m.l.map(function (s) {
      return s.replace('–A', '<b>–A</b>').replace('Lancement dans 15 jours.', '<strong>Lancement dans 15 jours.</strong>');
    }).join('<br>');
    html += '<div id="n' + k + '" class="nt ' + (m.who === 'A' ? 'a' : 's') + '">' + (m.who === 'A' ? ICON_A : ICON_S) +
      '<div class="hd"><b>' + (m.who === 'A' ? 'A' : 'Scalify') + '</b><i>maintenant</i></div><div class="bd">' + body + '</div></div>';
  });
  list.innerHTML = html;

  var tl = gsap.timeline({ paused: true });
  var ft = function (t, a, b, at) { b.immediateRender = false; tl.fromTo(t, a, b, at); };
  // position (y) de la carte j quand la carte k vient d'arriver (la plus récente en haut)
  var posAt = function (j, k) { var y = Y0; for (var i = j + 1; i <= k; i++) y += H(MSG[i]) + GAP; return y; };
  MSG.forEach(function (m, j) { gsap.set('#n' + j, { y: Y0 - 60, opacity: 0, scale: 0.9 }); });
  MSG.forEach(function (m, k) {
    var t = m.t, el = '#n' + k;
    ft(el, { y: Y0 - 60, opacity: 0, scale: 0.9 }, { y: Y0, opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.5)' }, t);
    if (m.who === 'A') {   // vibration : la carte de A tremble en arrivant
      var F = 1 / 30;
      [-1.6, 1.4, -1.0, 0.6, 0].forEach(function (r, i) { tl.to(el, { rotation: r, x: r * 3, duration: F, ease: 'none' }, t + 0.3 + i * F); });
    }
    for (var j = 0; j < k; j++) {
      var a = posAt(j, k - 1), b = posAt(j, k);
      if (a > YMAX + 400) continue;
      ft('#n' + j, { y: a }, { y: b, duration: 0.5, ease: 'power3.out' }, t);
      if (b > YMAX && a <= YMAX) ft('#n' + j, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.94, duration: 0.35, ease: 'power2.in' }, t);
    }
  });
  // déverrouillage : les notifications partent avec l'écran
  ft('#n-list', { y: 0 }, { y: -1940, duration: 0.55, ease: 'power3.in' }, UNLOCK);
  window.__timelines["notifs"] = tl;
})();
</script>
</template>
</body>
</html>
