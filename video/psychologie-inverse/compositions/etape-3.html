<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /><title>etape-3</title></head>
<body>
<template id="etape-3">
<style>
@font-face { font-family: "Anton"; src: url("assets/fonts/Anton-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "JBM"; src: url("assets/fonts/JetBrainsMono-500.woff2") format("woff2"); font-weight: 500; }
</style>
<div id="root" data-composition-id="etape-3" data-width="1080" data-height="1920">
  <!-- Étape 3 : « Trois. Gardez votre site de 2009. » — écran cathodique, marquee, compteur de visiteurs -->
  <div id="e-p3" class="e-page">
    <div class="e-num">3</div>
    <div class="e-titre"><span class="e-ln"><span class="e-w"><b>Gardez</b></span> <span class="e-w"><b>votre</b></span></span><span class="e-ln"><span class="e-w"><b>site</b></span> <span class="e-w"><b>de</b></span> <span class="e-w"><b>2009.</b></span></span></div>
    <div class="e-meta"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="16" fill="#dceeff" stroke="#161311" stroke-width="4"/><ellipse cx="22" cy="22" rx="7" ry="16" fill="none" stroke="#161311" stroke-width="3"/><path d="M 6 22 H 38 M 9 14 H 35 M 9 30 H 35" stroke="#161311" stroke-width="3"/></svg>COMPATIBLE <em>INTERNET EXPLORER 6</em></div>
    <svg class="e-illu" viewBox="0 0 1080 880">
      <defs>
        <clipPath id="e3-clip"><rect x="-280" y="118" width="560" height="392" rx="24"/></clipPath>
        <clipPath id="e3-dclip"><rect x="88" y="392" width="27" height="40"/></clipPath>
        <pattern id="e3-hz" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="36" fill="#161311"/><rect x="18" width="18" height="36" fill="#ffd731"/></pattern>
        <pattern id="e3-scan" width="8" height="6" patternUnits="userSpaceOnUse"><rect width="8" height="2" fill="#000" opacity="0.22"/></pattern>
      </defs>
      <g id="e3-boil">
        <path d="M 60 812 L 1020 812" stroke="#161311" stroke-width="8" stroke-linecap="round"/>
        <g transform="translate(662,0)">
          <rect x="-330" y="680" width="660" height="28" rx="6" fill="#d8b483" stroke="#161311" stroke-width="8"/>
          <rect x="-300" y="708" width="28" height="104" fill="#d8b483" stroke="#161311" stroke-width="7"/>
          <rect x="272" y="708" width="28" height="104" fill="#d8b483" stroke="#161311" stroke-width="7"/>
          <path d="M -80 600 L 80 600 L 112 652 L -112 652 Z" fill="#e2d8bf" stroke="#161311" stroke-width="8" stroke-linejoin="round"/>
          <rect x="-176" y="650" width="352" height="32" rx="10" fill="#e2d8bf" stroke="#161311" stroke-width="8"/>
          <rect x="-320" y="80" width="640" height="524" rx="44" fill="#efe6cf" stroke="#161311" stroke-width="9"/>
          <rect x="-64" y="548" width="128" height="26" rx="7" fill="#ddd2b6" stroke="#161311" stroke-width="4"/>
          <circle cx="262" cy="561" r="10" fill="#55db9c" stroke="#161311" stroke-width="4"/>
          <rect x="-280" y="118" width="560" height="392" rx="24" fill="#1d2a8a"/>
          <g clip-path="url(#e3-clip)">
            <g id="e3-dots"></g>
            <g id="e3-marq">
              <text x="0" y="200" font-family="Anton" font-size="54" fill="#ffd731">BIENVENUE SUR MON SITE !!!</text>
              <text x="620" y="200" font-family="Anton" font-size="54" fill="#ffd731">BIENVENUE SUR MON SITE !!!</text>
            </g>
            <rect x="-280" y="232" width="560" height="66" fill="url(#e3-hz)"/>
            <rect x="-128" y="243" width="256" height="44" rx="6" fill="#ffd731" stroke="#161311" stroke-width="4"/>
            <text x="0" y="278" text-anchor="middle" font-family="Anton" font-size="34" fill="#161311">EN CONSTRUCTION</text>
            <text x="-250" y="350" font-family="JBM" font-size="25" fill="#9ccaff" text-decoration="underline">Accueil | Produits | Contact</text>
            <text x="-250" y="420" font-family="JBM" font-size="24" fill="#ffffff">VISITEURS :</text>
            <rect x="-50" y="388" width="200" height="46" rx="4" fill="#0b0b0b" stroke="#55db9c" stroke-width="3"/>
            <text x="-11" y="423" font-family="JBM" font-size="34" fill="#55db9c">00001</text>
            <g clip-path="url(#e3-dclip)">
              <text id="e3-d2" x="91" y="423" font-family="JBM" font-size="34" fill="#55db9c">2</text>
              <text id="e3-d3" x="91" y="423" font-family="JBM" font-size="34" fill="#55db9c">3</text>
            </g>
            <text x="-250" y="482" font-family="JBM" font-size="17.5" fill="#b9c3ff">© 2009 · Meilleure résolution : 800×600</text>
            <g transform="translate(210,166)">
              <path id="e3-burst" d="M 0 0" fill="#fb4903" stroke="#161311" stroke-width="4" stroke-linejoin="round"/>
              <text x="0" y="10" text-anchor="middle" font-family="Anton" font-size="28" fill="#fffdf8">NEW!</text>
            </g>
            <path d="M -280 118 L -110 118 L -280 270 Z" fill="#ffffff" opacity="0.13"/>
            <rect x="-280" y="118" width="560" height="392" fill="url(#e3-scan)"/>
          </g>
          <rect x="-280" y="118" width="560" height="392" rx="24" fill="none" stroke="#161311" stroke-width="7"/>
        </g>
      </g>
      <g transform="translate(70,330)"><path id="e3-spark1" d="M 0 -30 Q 4 -4 30 0 Q 4 4 0 30 Q -4 4 -30 0 Q -4 -4 0 -30 Z" fill="#ffd731" stroke="#161311" stroke-width="5" stroke-linejoin="round"/></g>
      <g transform="translate(262,290)"><path id="e3-spark2" d="M 0 -22 Q 3 -3 22 0 Q 3 3 0 22 Q -3 3 -22 0 Q -3 -3 0 -22 Z" fill="#ffd731" stroke="#161311" stroke-width="4.5" stroke-linejoin="round"/></g>
      <g transform="translate(165,812) scale(1.25)"><g id="e3-man-boil"></g></g>
    </svg>
    <div class="e-dim"></div>
  </div>
</div>
<script>
(function () {
  var SK = window.SK, H = SK.hash, $ = function (id) { return document.getElementById(id); };
  var O = 10.4, DUR = 3.2, T = function (t) { return +(t - O).toFixed(3); };

  $('e3-man-boil').innerHTML = SK.man('e3-man', { mouth: 'grin', look: 7 });
  var dots = '', i;
  for (i = 0; i < 26; i++) dots += '<circle cx="' + (H(i, 21) * 270).toFixed(1) + '" cy="' + (314 + H(i, 23) * 190).toFixed(1) + '" r="' +
    (1.6 + (H(i, 29) + 1)).toFixed(1) + '" fill="#ffffff" opacity="0.5"/>';
  $('e3-dots').innerHTML = dots;
  var burst = '';
  for (i = 0; i < 24; i++) {
    var ab = (i * Math.PI) / 12, rb = i % 2 ? 40 : 56;
    burst += (i ? ' L ' : 'M ') + (Math.cos(ab) * rb).toFixed(1) + ' ' + (Math.sin(ab) * rb).toFixed(1);
  }
  $('e3-burst').setAttribute('d', burst + ' Z');

  var tl = gsap.timeline({ paused: true }), ft = SK.ft(tl);
  SK.page(tl, '#e-p3', { next: T(13.05) });
  SK.words(tl, '#e-p3 .e-w > b', [T(10.93), T(11.31), T(11.62), T(12.0), T(12.14)]);

  // le site qui défile, le badge NEW! qui tourne
  gsap.set('#e3-marq', { x: -200 });
  ft('#e3-marq', { x: -200 }, { x: -820, duration: 3.15, ease: 'none' }, 0);
  ft('#e3-burst', { rotation: 0 }, { rotation: 200, duration: 3.15, ease: 'none', svgOrigin: '0 0' }, 0);
  // il montre son site, fier ; étincelles
  ft('#e3-man-armR', { rotation: 0 }, { rotation: -112, duration: 0.36, ease: 'back.out(1.7)', svgOrigin: SK.PIV.armR }, T(10.98));
  SK.piv('#e3-spark1, #e3-spark2, #e3-burst', '0 0');
  gsap.set('#e3-spark1, #e3-spark2', { scale: 0, opacity: 0 });
  ft('#e3-spark1', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: 'back.out(3)', svgOrigin: '0 0' }, T(11.3));
  ft('#e3-spark2', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.28, ease: 'back.out(3)', svgOrigin: '0 0' }, T(11.42));
  // « … de 2009 » : le compteur passe à 000013, il saute de joie
  gsap.set('#e3-d3', { y: 40 });
  ft('#e3-d2', { y: 0 }, { y: -40, duration: 0.24, ease: 'power2.in' }, T(12.2));
  ft('#e3-d3', { y: 40 }, { y: 0, duration: 0.3, ease: 'back.out(2)' }, T(12.3));
  ft('#e3-man', { y: 0 }, { y: -26, duration: 0.16, ease: 'power2.out', yoyo: true, repeat: 1 }, T(12.24));

  SK.boil(tl, ['#e3-boil', '#e3-man-boil'], { amp: 1.3, rot: 0.3, seed: 9 });
  SK.drive(tl, DUR);
  window.__timelines["etape-3"] = tl;
})();
</script>
</template>
</body>
</html>
