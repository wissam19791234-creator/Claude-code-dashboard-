<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /><title>etape-2</title></head>
<body>
<template id="etape-2">
<style>
@font-face { font-family: "Anton"; src: url("assets/fonts/Anton-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "JBM"; src: url("assets/fonts/JetBrainsMono-500.woff2") format("woff2"); font-weight: 500; }
</style>
<div id="root" data-composition-id="etape-2" data-width="1080" data-height="1920">
  <!-- Étape 2 : « Deux. Ne répondez jamais aux avis. » — casque antibruit, les avis s'empilent -->
  <div id="e-p2" class="e-page">
    <div class="e-num">2</div>
    <div class="e-titre"><span class="e-ln"><span class="e-w"><b>Ne</b></span> <span class="e-w"><b>répondez</b></span></span><span class="e-ln"><span class="e-w"><b>jamais</b></span> <span class="e-w"><b>aux</b></span> <span class="e-w"><b>avis.</b></span></span></div>
    <div class="e-meta"><svg viewBox="0 0 44 44"><path d="M 8 29 V 22 a 14 14 0 0 1 28 0 V 29" fill="none" stroke="#161311" stroke-width="5" stroke-linecap="round"/><rect x="4" y="23" width="10" height="15" rx="4" fill="#fb4903" stroke="#161311" stroke-width="3"/><rect x="30" y="23" width="10" height="15" rx="4" fill="#fb4903" stroke="#161311" stroke-width="3"/></svg>OUTIL REQUIS : <em>CASQUE ANTIBRUIT</em></div>
    <svg class="e-illu" viewBox="0 0 1080 880">
      <g id="e2-boil">
        <path d="M 60 812 L 1020 812" stroke="#161311" stroke-width="8" stroke-linecap="round"/>
        <g id="e2-bulles"></g>
      </g>
      <g transform="translate(286,812) scale(1.3)"><g id="e2-man-boil"></g></g>
      <g id="e2-notes"></g>
    </svg>
    <div class="e-dim"></div>
  </div>
</div>
<script>
(function () {
  var SK = window.SK, C = SK.C, $ = function (id) { return document.getElementById(id); };
  var O = 8.2, DUR = 2.75, T = function (t) { return +(t - O).toFixed(3); };

  $('e2-man-boil').innerHTML = SK.man('e2-man', { mouth: 'smile', eyes: 'happy', phones: true });
  // bulle d'avis : rectangle arrondi + queue, origine = pointe de la queue
  var bubbleD = function (w, h) {
    var x0 = -30, x1 = w - 30, y0 = -h - 40, y1 = -40, r = 22;
    return 'M ' + (x0 + r) + ' ' + y0 + ' H ' + (x1 - r) + ' Q ' + x1 + ' ' + y0 + ' ' + x1 + ' ' + (y0 + r) + ' V ' + (y1 - r) +
      ' Q ' + x1 + ' ' + y1 + ' ' + (x1 - r) + ' ' + y1 + ' H 34 L -18 0 L -2 ' + y1 + ' H ' + (x0 + r) + ' Q ' + x0 + ' ' + y1 + ' ' + x0 + ' ' + (y1 - r) +
      ' V ' + (y0 + r) + ' Q ' + x0 + ' ' + y0 + ' ' + (x0 + r) + ' ' + y0 + ' Z';
  };
  var BUL = [
    { x: 500, y: 300, w: 320, rot: -3, stars: 1 },
    { x: 702, y: 432, w: 244, rot: 4, txt: 'ALLÔ ?', fs: 60 },
    { x: 470, y: 566, w: 380, rot: -2, txt: 'VOUS ÊTES LÀ ?', fs: 52 },
    { x: 640, y: 700, w: 330, rot: 3, stars: 2 },
    { x: 128, y: 306, w: 206, rot: -5, txt: '???', fs: 64 },
    { x: 452, y: 812, w: 404, rot: -1.5, txt: 'TOUJOURS RIEN…', fs: 52 }
  ];
  var bm = '';
  BUL.forEach(function (b, k) {
    var cx = b.w / 2 - 30, cy = -90;
    var inner = b.stars ? SK.stars(cx - 112, cy + 2, 24, 56, 5, b.stars)
      : '<text x="' + cx + '" y="' + (cy + b.fs * 0.36) + '" text-anchor="middle" font-family="Anton" font-size="' + b.fs + '" fill="' + C.ink + '">' + b.txt + '</text>';
    bm += '<g transform="translate(' + b.x + ',' + b.y + ') rotate(' + b.rot + ')"><g id="e2-b' + k + '">' +
      '<path d="' + bubbleD(b.w, 100) + '" fill="#fffdf8" stroke="' + C.ink + '" stroke-width="6" stroke-linejoin="round"/>' + inner + '</g></g>';
  });
  $('e2-bulles').innerHTML = bm;
  var notes = '', i;
  for (i = 0; i < 4; i++) notes += SK.note('e2-n' + i, i % 2 ? 380 : 192, 420);
  $('e2-notes').innerHTML = notes;

  var tl = gsap.timeline({ paused: true }), ft = SK.ft(tl);
  SK.page(tl, '#e-p2', { next: T(10.4) });
  SK.words(tl, '#e-p2 .e-w > b', [T(8.76), T(8.91), T(9.39), T(9.7), T(9.77)]);

  // il n'entend rien (il se balance), les avis s'empilent
  gsap.set('#e2-man-head', { rotation: -6, svgOrigin: SK.PIV.head });
  SK.piv('#e2-bulles g[id]', '-18 0');
  SK.piv('#e2-notes g[id]', '0 0');
  gsap.set('#e2-bulles g[id]', { scale: 0, opacity: 0 });
  gsap.set('#e2-notes g[id]', { opacity: 0 });
  ft('#e2-man-head', { rotation: -6 }, { rotation: 6, duration: 0.36, ease: 'sine.inOut', yoyo: true, repeat: 5, svgOrigin: SK.PIV.head }, T(8.45));
  for (i = 0; i < 6; i++) {
    ft('#e2-b' + i, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2.4)', svgOrigin: '-18 0' }, T(8.62) + i * 0.22);
  }
  for (i = 0; i < 4; i++) SK.floatUp(tl, '#e2-n' + i, T(8.55) + i * 0.36, i % 2 ? 18 : -18, i % 2 ? 52 : -52, i % 2 ? 10 : -10);

  SK.boil(tl, ['#e2-boil', '#e2-man-boil'], { amp: 1.3, rot: 0.3, seed: 8 });
  SK.drive(tl, DUR);
  window.__timelines["etape-2"] = tl;
})();
</script>
</template>
</body>
</html>
