<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Scalify — Message from A</title>
<script src="src/vendor/gsap.min.js"></script>
<script src="src/script.js"></script>
<style>
@font-face { font-family: "Inter Tight"; src: url("assets/fonts/InterTight-var.woff2") format("woff2"); font-weight: 100 900; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1b0f2a; }
#root { width: 100%; height: 100%; position: relative; overflow: hidden; font-family: "Inter Tight", sans-serif; }
.clip { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
  <!-- carte finale, sous l'écran verrouillé (révélée au déverrouillage) -->
  <div id="fin" class="clip" style="z-index: 1" data-composition-id="fin" data-composition-src="compositions/fin.html" data-start="25.9" data-duration="4.1" data-track-index="3" data-width="1080" data-height="1920"></div>
  <!-- l'écran verrouillé du commerçant -->
  <div id="ecran" class="clip" style="z-index: 2" data-composition-id="ecran" data-composition-src="compositions/ecran.html" data-start="0" data-duration="27.2" data-track-index="0" data-width="1080" data-height="1920"></div>
  <!-- notifications de « A » puis de Scalify -->
  <div id="notifs" class="clip" style="z-index: 3" data-composition-id="notifs" data-composition-src="compositions/notifs.html" data-start="0" data-duration="27.2" data-track-index="1" data-width="1080" data-height="1920"></div>
  <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="30" data-track-index="4" data-volume="1"></audio>
</div>
<script>
  window.__timelines["main"] = gsap.timeline({ paused: true });
</script>
</body>
</html>
