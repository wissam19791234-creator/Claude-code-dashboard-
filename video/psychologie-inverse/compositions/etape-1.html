<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /><title>etape-1</title></head>
<body>
<template id="etape-1">
<style>
@font-face { font-family: "Anton"; src: url("assets/fonts/Anton-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "JBM"; src: url("assets/fonts/JetBrainsMono-500.woff2") format("woff2"); font-weight: 500; }
</style>
<div id="root" data-composition-id="etape-1" data-width="1080" data-height="1920">
  <!-- Étape 1 : « Un. Ignorez votre fiche Google. » — fiche poussiéreuse, toiles, araignée, il siffle ailleurs -->
  <div id="e-p1" class="e-page">
    <div class="e-num">1</div>
    <div class="e-titre"><span class="e-ln"><span class="e-w"><b>Ignorez</b></span> <span class="e-w"><b>votre</b></span></span><span class="e-ln"><span class="e-w"><b>fiche</b></span> <span class="e-w"><b>Google.</b></span></span></div>
    <div class="e-meta"><svg viewBox="0 0 44 44"><rect x="3" y="12" width="7" height="20" rx="2" fill="#161311"/><rect x="10" y="16" width="5" height="12" rx="1" fill="#161311"/><rect x="15" y="20" width="14" height="4" fill="#161311"/><rect x="29" y="16" width="5" height="12" rx="1" fill="#161311"/><rect x="34" y="12" width="7" height="20" rx="2" fill="#161311"/></svg>EFFORT REQUIS : <em>AUCUN</em></div>
    <svg class="e-illu" viewBox="0 0 1080 880">
      <g id="e1-boil">
        <path d="M 60 812 L 1020 812" stroke="#161311" stroke-width="8" stroke-linecap="round"/>
        <g transform="translate(704,446) rotate(-3)">
          <g id="e1-card">
            <rect x="-270" y="-330" width="540" height="620" rx="26" fill="#fffdf8" stroke="#161311" stroke-width="8"/>
            <rect x="-240" y="-300" width="480" height="210" rx="14" fill="#e9e3d6" stroke="#161311" stroke-width="5"/>
            <path d="M -120 -112 L -46 -214 L 4 -150 L 44 -196 L 118 -112 Z" fill="#d3cab8"/>
            <circle cx="92" cy="-250" r="22" fill="#d3cab8"/>
            <text x="-240" y="-30" font-family="Anton" font-size="54" fill="#161311">VOTRE COMMERCE</text>
            <g id="e1-stars"></g>
            <text x="64" y="40" font-family="JBM" font-size="24" fill="#6b6257">(0 avis)</text>
            <text x="-240" y="116" font-family="JBM" font-size="27" fill="#6b6257">Horaires : ???</text>
            <text x="-240" y="164" font-family="JBM" font-size="27" fill="#6b6257">Tél. : ???</text>
            <text x="-240" y="212" font-family="JBM" font-size="27" fill="#6b6257">Mis à jour : jamais</text>
            <g id="e1-dust"></g>
            <path id="e1-web1" d="M 0 0" fill="none" stroke="#7d7466" stroke-width="3" stroke-linecap="round"/>
            <path id="e1-web2" d="M 0 0" fill="none" stroke="#7d7466" stroke-width="3" stroke-linecap="round"/>
            <line id="e1-fil" x1="168" y1="-330" x2="168" y2="-148" stroke="#161311" stroke-width="3"/>
            <g transform="translate(168,-148) scale(1.2)">
              <g id="e1-spider">
                <path d="M -9 -6 Q -32 -28 -44 -10 M -11 0 Q -38 -10 -50 8 M -11 6 Q -36 14 -44 34 M -7 11 Q -24 32 -28 50 M 9 -6 Q 32 -28 44 -10 M 11 0 Q 38 -10 50 8 M 11 6 Q 36 14 44 34 M 7 11 Q 24 32 28 50" fill="none" stroke="#161311" stroke-width="5" stroke-linecap="round"/>
                <ellipse cx="0" cy="8" rx="17" ry="21" fill="#161311"/>
                <circle cx="0" cy="-15" r="12" fill="#161311"/>
                <circle cx="-5" cy="-17" r="4.5" fill="#fff"/><circle cx="5" cy="-17" r="4.5" fill="#fff"/>
                <circle cx="-4.5" cy="-16" r="2" fill="#161311"/><circle cx="5.5" cy="-16" r="2" fill="#161311"/>
              </g>
            </g>
            <g transform="translate(-6,-196) rotate(-9)">
              <g id="e1-stamp">
                <rect x="-128" y="-54" width="256" height="108" rx="14" fill="rgba(255,253,248,0.55)" stroke="#fb4903" stroke-width="9"/>
                <text x="0" y="25" text-anchor="middle" font-family="Anton" font-size="66" fill="#fb4903">FERMÉ ?</text>
              </g>
            </g>
          </g>
        </g>
      </g>
      <g transform="translate(250,812) scale(1.3)"><g id="e1-man-boil"></g></g>
      <g id="e1-notes"></g>
    </svg>
    <div class="e-dim"></div>
  </div>
</div>
<script>
(function () {
  var SK = window.SK, H = SK.hash, $ = function (id) { return document.getElementById(id); };
  var O = 6.0, DUR = 2.75, T = function (t) { return +(t - O).toFixed(3); };   // temps absolus → locaux

  $('e1-man-boil').innerHTML = SK.man('e1-man', { mouth: 'o', look: -8 });
  $('e1-stars').innerHTML = SK.stars(-222, 28, 24, 56, 5, 0);
  var dust = '', i;
  for (i = 0; i < 34; i++) {
    dust += '<circle cx="' + (H(i, 4) * 250).toFixed(1) + '" cy="' + (-20 + H(i, 9) * 300).toFixed(1) + '" r="' +
      (2.4 + (H(i, 13) + 1) * 1.6).toFixed(1) + '" fill="#b3a893" opacity="0.75"/>';
  }
  $('e1-dust').innerHTML = dust;
  // toile : rayons depuis un coin + anneaux qui pendent vers le coin
  var web = function (cx, cy, a0, a1, R, n, rings) {
    var d = '', k, j, pts = [];
    for (k = 0; k < n; k++) {
      var a = a0 + ((a1 - a0) * k) / (n - 1);
      pts.push([Math.cos(a), Math.sin(a)]);
      d += 'M ' + cx + ' ' + cy + ' L ' + (cx + Math.cos(a) * R).toFixed(1) + ' ' + (cy + Math.sin(a) * R).toFixed(1) + ' ';
    }
    for (j = 1; j <= rings; j++) {
      var rr = (R * j) / (rings + 0.35);
      d += 'M ' + (cx + pts[0][0] * rr).toFixed(1) + ' ' + (cy + pts[0][1] * rr).toFixed(1) + ' ';
      for (k = 1; k < n; k++) {
        var mx = (pts[k - 1][0] + pts[k][0]) / 2, my = (pts[k - 1][1] + pts[k][1]) / 2;
        d += 'Q ' + (cx + mx * rr * 0.72).toFixed(1) + ' ' + (cy + my * rr * 0.72).toFixed(1) + ' ' +
          (cx + pts[k][0] * rr).toFixed(1) + ' ' + (cy + pts[k][1] * rr).toFixed(1) + ' ';
      }
    }
    return d;
  };
  $('e1-web1').setAttribute('d', web(-262, -322, 0, Math.PI / 2, 170, 5, 3));
  $('e1-web2').setAttribute('d', web(262, -322, Math.PI / 2, Math.PI, 120, 4, 2));
  var notes = '';
  for (i = 0; i < 3; i++) notes += SK.note('e1-n' + i, 214, 446);
  $('e1-notes').innerHTML = notes;

  var tl = gsap.timeline({ paused: true }), ft = SK.ft(tl);
  SK.page(tl, '#e-p1', { next: T(8.2) });
  SK.words(tl, '#e-p1 .e-w > b', [T(6.49), T(6.88), T(7.17), T(7.4)]);

  // il siffle en regardant ailleurs
  gsap.set('#e1-man-armL', { rotation: 10, svgOrigin: SK.PIV.armL });
  gsap.set('#e1-man-armR', { rotation: -10, svgOrigin: SK.PIV.armR });
  gsap.set('#e1-man-head', { rotation: -5, svgOrigin: SK.PIV.head });
  SK.piv('#e1-notes g[id]', '0 0');
  gsap.set('#e1-notes g[id]', { opacity: 0 });
  ft('#e1-man-head', { rotation: -5 }, { rotation: 5, duration: 0.4, ease: 'sine.inOut', yoyo: true, repeat: 4, svgOrigin: SK.PIV.head }, T(6.3));
  for (i = 0; i < 3; i++) SK.floatUp(tl, '#e1-n' + i, T(6.5) + i * 0.42, -26, -72, -12);
  // toiles, araignée, tampon « FERMÉ ? »
  SK.drawOn(tl, ['#e1-web1', '#e1-web2'], T(6.55), 0.5, { stagger: 0.18, ease: 'power1.inOut' });
  gsap.set('#e1-fil', { attr: { y2: -330 } });
  gsap.set('#e1-spider', { y: -150, opacity: 0 });
  ft('#e1-fil', { attr: { y2: -330 } }, { attr: { y2: -148 }, duration: 0.62, ease: 'bounce.out' }, T(7.16));
  ft('#e1-spider', { y: -150 }, { y: 0, duration: 0.62, ease: 'bounce.out' }, T(7.16));
  ft('#e1-spider', { opacity: 0 }, { opacity: 1, duration: 0.06 }, T(7.16));
  gsap.set('#e1-stamp', { opacity: 0 });
  SK.stamp(tl, '#e1-stamp', T(7.6), '#e1-card', { rot: 0, from: 2.3, px: 9, origin: '0 0' });

  SK.boil(tl, ['#e1-boil', '#e1-man-boil'], { amp: 1.3, rot: 0.3, seed: 7 });
  SK.drive(tl, DUR);
  window.__timelines["etape-1"] = tl;
})();
</script>
</template>
</body>
</html>
