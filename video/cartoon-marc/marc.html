<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Scalify Marc</title>
<style>
@font-face{font-family:Lil;src:url(fonts/LilitaOne-400.woff2)}
@font-face{font-family:Fre;font-weight:500 700;src:url(fonts/Fredoka-600.woff2)}
*{margin:0;padding:0}html,body{overflow:hidden;background:#000}svg{display:block}
.t{font-family:Lil;paint-order:stroke fill;stroke:#1d1b2e;stroke-linejoin:round}

      <rect x="80" y="742" width="920" height="40" rx="14" fill="#b97a33" class="ol"/>

    </g></g>
    <g id="queue"></g>
    <g id="items"></g>
    <g id="fx"></g>
  </g>

  <g id="final" opacity="0"></g>
</g>
<g id="caps"></g>
<circle id="iris" r="0" fill="#ff6fb5"/>
