<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Scalify Nuit</title>
<style>
@font-face{font-family:IS;font-style:italic;src:url(fonts/InstrumentSerif-italic.woff2)}
@font-face{font-family:IS;font-style:normal;src:url(fonts/InstrumentSerif-normal.woff2)}
@font-face{font-family:IT;font-weight:400;src:url(fonts/InterTight-400.woff2)}
@font-face{font-family:IT;font-weight:500;src:url(fonts/InterTight-500.woff2)}
@font-face{font-family:IT;font-weight:600;src:url(fonts/InterTight-600.woff2)}
@font-face{font-family:JM;src:url(fonts/JetBrainsMono-400.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%}
.tx{position:absolute;opacity:0;color:#fff;will-change:opacity,transform,filter}
.k{font:500 calc(var(--u)*20)/1 JM;letter-spacing:.32em;text-transform:uppercase;color:#ffd9b8;opacity:.9}
.h{font:italic calc(var(--u)*92)/.98 IS;letter-spacing:-.01em;margin-top:calc(var(--u)*22);text-shadow:0 4px 40px #0006}
.big{font:italic calc(var(--u)*120)/1 IS;text-align:center;left:0;right:0;text-shadow:0 4px 50px #000a}
.cap{left:0;right:0;text-align:center;font:italic calc(var(--u)*64)/1.1 IS;text-shadow:0 4px 30px #000}
.sub{left:0;right:0;text-align:center;font:400 calc(var(--u)*24)/1.3 IT;letter-spacing:.42em;text-transform:uppercase;color:#ffe3cc;text-shadow:0 2px 20px #000}
#demo{position:absolute;right:3%;bottom:4%;font:400 calc(var(--u)*15)/1 JM;letter-spacing:.2em;color:#ffffff80;text-transform:uppercase;opacity:0}
#grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:overlay;opacity:.06}
#vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,#0000 55%,#000b 100%)}
#black{position:absolute;inset:0;background:#000;opacity:0}
#flash{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 50%,#fff3e0,#ffb070 40%,#0000 75%);opacity:0;mix-blend-mode:screen}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><div id="st">
<canvas id="c"></canvas>
<div id="vig"></div>
<div class="tx big" id="h1">Cette nuit,<br>dans votre commerce…</div>
<div class="tx big" id="h2">Vous, vous avez dormi.</div>
<div class="tx big" id="h3">Scalify, non.</div>
<div class="tx sub" id="lt">Lancement dans</div>
<div class="tx sub" id="jrs" style="letter-spacing:.6em;font-weight:500">Jours</div>
<div class="tx big" id="offre" style="font-size:calc(var(--u)*56)">15 places fondateurs · -30 %</div>
<div class="tx big" id="fin1" style="font-size:calc(var(--u)*130)">Scalify</div>
<div class="tx big" id="fin2" style="font-size:calc(var(--u)*54)">Votre commerce, en pilote automatique.</div>
<div id="demo">Exemple de démonstration</div>
<canvas id="grain" width="480" height="270"></canvas>
<div id="flash"></div>
<div id="black"></div>
</div>
<script type="module" src="nuit.js"></script>
</body></html>
